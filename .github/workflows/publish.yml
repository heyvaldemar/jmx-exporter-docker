name: Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild: the week's Debian security updates, Java's among them.
    # The pinned digests and the jmx_exporter commit move only by pull request.
    - cron: "20 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: heyvaldemar/jmx-exporter

jobs:
  lint:
    name: Lint Dockerfile and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh

  version:
    name: The jmx_exporter release the Dockerfile builds
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      major: ${{ steps.v.outputs.major }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read it from the pin
        id: v
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^ARG JMX_EXPORTER=([0-9]+\.[0-9]+\.[0-9]+):[0-9a-f]{40}$/\1/p' Dockerfile | sort -u)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the Dockerfile does not pin one jmx_exporter release as N.N.N:<commit> (got '${version}')"; exit 1; }
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
          } >> "$GITHUB_OUTPUT"
          echo "jmx_exporter $version"

  test:
    name: Test before it is published
    runs-on: ubuntu-latest
    needs: [lint, version]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image for this runner
        run: docker build -t jmx-exporter:test .

      # The same user, working directory, entrypoint, command, PATH, HOME and
      # files as the last versioned bitnami/jmx-exporter, every executable on
      # its PATH or a reason, and both images run the way the charts run them,
      # against the same Java process.
      - name: A drop-in for bitnami/jmx-exporter
        run: ./tests/drop-in-test.sh jmx-exporter:test

      # No critical or high finding that a rebuild can remove.
      - name: No fixable critical or high finding
        run: ./scripts/cve-gate.sh jmx-exporter:test

      # Nothing a chart used yesterday is gone today.
      - name: The contract with what is already published
        env:
          MAJOR: ${{ needs.version.outputs.major }}
        run: ./scripts/contract-test.sh jmx-exporter:test "${IMAGE_NAME}:${MAJOR}"

      # Bitnami's own Kafka chart, on a fresh kind cluster, with this image as
      # its JMX exporter, reporting the messages written to a topic.
      - name: Bitnami's Kafka chart runs its JMX exporter on it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker tag jmx-exporter:test "jmx-exporter:${VERSION}"
          ./tests/charts-e2e.sh "jmx-exporter:${VERSION}"

  plants:
    name: The tests, shown each violation they exist for
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every plant is caught
        run: python3 tests/plant-violations.py -- bash -c "docker build -q -t jmx-exporter:plant . >/dev/null 2>&1 && ./tests/drop-in-test.sh jmx-exporter:plant >/dev/null 2>&1 && ./scripts/cve-gate.sh jmx-exporter:plant >/dev/null 2>&1"

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # Nothing is published that the tests have not passed, or whose tests
    # have not been seen to fail.
    needs: [lint, version, test, plants]
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Hub credentials are set
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::this repository has no DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret; add both (a Docker Hub access token with write access to heyvaldemar/jmx-exporter) and run the workflow again"
            exit 1
          fi

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "vcs_ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The jmx_exporter release (1.7.0), its minor (1.7) and major (1), and
      # latest. Each moves with the weekly rebuild, so a pinned tag still
      # receives security updates; pin a digest for an image that never
      # changes.
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=${{ needs.version.outputs.major }}
          labels: |
            org.opencontainers.image.title=jmx-exporter
            org.opencontainers.image.description=Prometheus's JMX exporter ${{ needs.version.outputs.version }} on Debian 13, built from source, rebuilt weekly, signed; a drop-in for bitnami/jmx-exporter.
            org.opencontainers.image.vendor=heyvaldemar
            org.opencontainers.image.licenses=MIT AND Apache-2.0
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ steps.meta-build.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta-build.outputs.build_date }}
          # No cache from earlier runs: the weekly rebuild exists to take the
          # week's Debian updates, which a cached apt layer would skip.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=jmx-exporter
          cache-to: type=gha,mode=max,scope=jmx-exporter
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # Cosign v2: tag-based .sig storage, which works on Docker Hub today
        # (heyvaldemar/aws-kubectl-docker, hotfix #20).
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.1"

      - name: Sign image with cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${TAGS}" ] || [ -z "${DIGEST}" ]; then
            echo "ERROR: TAGS or DIGEST is empty" >&2
            exit 1
          fi
          echo "${TAGS}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing: ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done

      # The signature a stranger checks, checked here on every tag just
      # pushed: a tag whose signature does not verify fails the publish.
      - name: Verify every tag's signature
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "${TAGS}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign verify "$tag" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "verified: $tag"
          done

  scan-trivy:
    name: Scan the published image with Trivy
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Findings do not fail this job; a scan that cannot finish does.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-jmx-exporter

  measure:
    name: CVE counts against the images it replaces
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Count
        env:
          PLATFORM: linux/amd64
          MAJOR: ${{ needs.version.outputs.major }}
        run: |
          set -o pipefail
          ./scripts/measure-cves.sh "${IMAGE_NAME}:${MAJOR}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the counts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cves
          path: reports/
          retention-days: 90

  # The ruleset requires checks by names that stay put. This one stands for
  # every job the publish depends on, and fails if any failed or was skipped.
  published:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: [lint, version, test, plants, build]
    if: always()
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job it stands for passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, version, test, plants, build: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a job this one stands for ended '$r'"; exit 1; }
          done

  dockerhub-description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Prometheus's JMX exporter, built from source, rebuilt weekly, signed. A drop-in for bitnami/jmx-exporter."
          readme-filepath: ./README.md
